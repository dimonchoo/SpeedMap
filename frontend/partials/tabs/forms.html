                      <!-- Captcha & File Upload Status -->
                      <div class="grid grid-cols-2 gap-2 text-xs">
                        <div class="bg-slate-900/60 p-2.5 rounded-lg border border-slate-800/80 flex items-center space-x-2">
                          <span class="w-1.5 h-1.5 rounded-full shrink-0" :class="form.captcha?.isActive ? 'bg-emerald-400' : 'bg-amber-400'"></span>
                          <div class="truncate">
                            <div class="text-[9px] text-slate-500 uppercase font-medium">Капча</div>
                            <div class="font-medium text-[11px] truncate" :class="form.captcha?.isActive ? 'text-emerald-400' : 'text-amber-400'"
                              x-text="form.captcha?.isActive ? form.captcha.type : 'Немає'"></div>
                          </div>
                        </div>
                        <div class="bg-slate-900/60 p-2.5 rounded-lg border border-slate-800/80 flex items-center space-x-2">
                          <svg class="w-3 h-3 text-indigo-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/></svg>
                          <div class="truncate">
                            <div class="text-[9px] text-slate-500 uppercase font-medium">Файли</div>
                            <div class="font-medium text-[11px] truncate text-slate-200"
                              x-text="form.hasFileUpload ? (form.allowedFileTypes || 'Дозволено') : 'Вимкнено'"></div>
                          </div>
                        </div>
                      </div>

                      <!-- Fields Table / Summary -->
                      <div class="space-y-1">
                        <div class="flex items-center justify-between text-xs text-slate-400">
                          <span class="text-[10px] uppercase font-medium text-slate-500 tracking-wider">Структура полів:</span>
                          <span class="text-[10px] font-mono" x-text="`${form.fieldCount} полів`"></span>
                        </div>
                        <div class="max-h-36 overflow-y-auto space-y-1 bg-slate-900/60 p-2 rounded-lg border border-slate-800 font-mono text-xs">
                          <template x-for="fld in form.fields" :key="fld.name">
                            <div class="flex items-center justify-between text-slate-300 py-0.5 border-b border-slate-800/40 last:border-0 text-[11px]">
                              <span class="truncate">
                                <span class="font-semibold text-slate-100" x-text="fld.name"></span>
                                <template x-if="fld.isRequired">
                                  <span class="text-rose-400 font-bold">*</span>
                                </template>
                                <span class="text-slate-500 text-[10px]" x-text="` (${fld.label})`"></span>
                              </span>
                              <span class="px-1.5 py-0.2 rounded bg-slate-800 text-[10px] text-blue-300 shrink-0 font-sans" x-text="fld.type"></span>
                            </div>
                          </template>
                        </div>
                      </div>
                    </div>

                    <!-- Expandable Pages Accordion -->
                    <div x-data="{ open: false }" class="space-y-1 pt-2 border-t border-slate-800/60">
                      <button @click="open = !open" class="w-full text-left text-xs font-medium text-slate-400 hover:text-blue-300 flex items-center justify-between transition">
                        <span x-text="`Сторінки з формою (${form.pages?.length || 0})`"></span>
                        <span x-text="open ? '▲' : '▼'"></span>
                      </button>
                      <div x-show="open" x-cloak class="max-h-28 overflow-y-auto space-y-1 bg-slate-900/90 p-2 rounded-lg border border-slate-800 font-mono text-[10px]">
                        <template x-for="pageUrl in form.pages" :key="pageUrl">
                          <button @click.stop="openUrlInBrowser(pageUrl)" class="block text-slate-300 hover:text-blue-400 truncate underline text-left w-full" :title="pageUrl" x-text="pageUrl"></button>
                        </template>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </template>
