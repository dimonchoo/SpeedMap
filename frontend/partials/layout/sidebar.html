      <!-- Left Column: Sitemap Input & Page Selector -->
      <section class="w-72 xl:w-80 bg-slate-950/40 border-r border-slate-800/80 flex flex-col shrink-0 transition-all duration-150">
        
        <!-- Site Profile Selector Box (Left Sidebar Top) -->
        <div class="p-4 border-b border-slate-800/80 bg-slate-950/60 space-y-2 relative z-30">
          <div class="flex items-center justify-between text-xs">
            <label class="block font-semibold text-slate-400 uppercase tracking-wider text-[11px]">Проєкт / Сайт</label>
          </div>

          <div class="relative" @click.outside="showProfileDropdown = false">
            <button @click="showProfileDropdown = !showProfileDropdown"
              class="w-full flex items-center justify-between bg-slate-900 hover:bg-slate-800/90 border border-slate-700/80 px-3.5 py-2 rounded-xl transition text-xs shadow-sm font-medium text-slate-200 group">
              <div class="flex items-center space-x-2.5 truncate">
                <span class="w-2 h-2 rounded-full bg-emerald-400 shrink-0"></span>
                <span class="font-semibold text-emerald-300 truncate text-sm" x-text="activeProfile ? activeProfile.name : 'Виберіть сайт'"></span>
              </div>
              <svg class="w-4 h-4 text-slate-400 group-hover:text-slate-200 transition-transform duration-200 shrink-0" :class="showProfileDropdown ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
              </svg>
            </button>

            <!-- Dropdown Menu Box -->
            <div x-show="showProfileDropdown" x-cloak
              x-transition:enter="transition ease-out duration-150 transform" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
              x-transition:leave="transition ease-in duration-100 transform" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95"
              class="absolute left-0 mt-2 w-full bg-slate-900 border border-slate-800 rounded-xl shadow-xl z-50 overflow-hidden flex flex-col divide-y divide-slate-800">
              
              <!-- Header & Search Bar -->
              <div class="p-3 bg-slate-950/80 space-y-2">
                <div class="flex items-center justify-between text-xs font-semibold text-slate-300">
                  <span class="text-slate-400">Ваші сайти (<span x-text="siteProfiles.length"></span>)</span>
                  <button @click="openCreateProfileModal()" class="flex items-center space-x-1 text-emerald-400 hover:text-emerald-300 text-[11px] font-semibold transition">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                    </svg>
                    <span>Додати сайт</span>
                  </button>
                </div>
                <input type="text" x-model="profileSearchQuery" placeholder="Швидкий пошук..."
                  class="w-full bg-slate-900 border border-slate-700/80 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500 font-sans">
              </div>

              <!-- Scrollable List of Profiles -->
              <div class="max-h-64 overflow-y-auto p-1 space-y-0.5">
                <template x-if="filteredSiteProfiles.length === 0">
                  <div class="p-4 text-center text-xs text-slate-500">Сайтів не знайдено</div>
                </template>

                <template x-for="p in filteredSiteProfiles" :key="p.id">
                  <div class="flex items-center justify-between p-2 rounded-lg hover:bg-slate-800/80 cursor-pointer group transition"
                    :class="p.id === activeProfileId ? 'bg-slate-800/90 text-emerald-400 font-semibold ring-1 ring-emerald-500/30' : 'text-slate-300'"
                    @click="selectProfile(p)">
                    
                    <div class="flex items-center space-x-2.5 truncate max-w-[200px]">
                      <svg class="w-3.5 h-3.5 shrink-0 text-slate-400 group-hover:text-slate-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/>
                      </svg>
                      <div class="truncate flex flex-col">
                        <span class="text-xs truncate font-medium group-hover:text-white" x-text="p.name"></span>
                        <span class="text-[10px] text-slate-500 truncate font-mono" x-text="p.sitemapUrl || 'Без sitemap'"></span>
                      </div>
                    </div>

                    <div class="flex items-center space-x-1 shrink-0 opacity-80 group-hover:opacity-100">
                      <button type="button" @click.stop="openEditProfileModal(p)" class="p-1 rounded hover:bg-slate-700 text-slate-400 hover:text-cyan-300 transition" title="Редагувати профіль">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
                        </svg>
                      </button>
                      <template x-if="siteProfiles.length > 1">
                        <button type="button" @click.stop="deleteProfile(p.id)" class="p-1 rounded hover:bg-rose-950/60 text-slate-400 hover:text-rose-400 transition" title="Видалити сайт">
                          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                          </svg>
                        </button>
                      </template>
                    </div>
                  </div>
                </template>
              </div>

            </div>
          </div>
        </div>

        <!-- Sitemap URL Input Form -->
        <div class="p-4 border-b border-slate-800/80 space-y-3">

          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Sitemap / Domain URL</label>
          <div class="flex space-x-2">
            <input type="text" x-model="sitemapInput" @keydown.enter="parseSitemap()" @blur="resolveCurrentDomain(sitemapInput)" placeholder="https://example.com/sitemap.xml"
              class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 font-mono">
            <button @click="parseSitemap()" :disabled="isParsing"
              class="bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-medium px-3.5 py-2 rounded-lg text-sm transition flex items-center shrink-0">
              <template x-if="!isParsing">
                <span>Парсинг</span>
              </template>
              <template x-if="isParsing">
                <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
              </template>
            </button>
          </div>
          
          <!-- Domain & Server IP Resolution Info -->
          <div x-show="domainInfo.ip" x-cloak class="flex items-center justify-between px-3 py-2 bg-slate-950/80 rounded-xl border border-slate-800 text-[11px] font-mono shadow-inner">
            <div class="flex items-center space-x-2 truncate min-w-0">
              <svg class="w-3.5 h-3.5 text-slate-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/>
              </svg>
              <span class="text-slate-200 font-bold select-all cursor-pointer hover:text-emerald-400 transition truncate"
                @click="copyToClipboard(domainInfo.ip)"
                :title="'Клікніть щоб скопіювати. Усі IP: ' + domainInfo.ips.join(', ')"
                x-text="domainInfo.ip"></span>
            </div>
            <div class="shrink-0 ml-2">
              <template x-if="domainInfo.isCloudflare">
                <span class="px-2 py-0.5 rounded-full bg-sky-500/15 text-sky-300 font-semibold border border-sky-500/30 flex items-center space-x-1.5" title="Трафік проходить через Cloudflare CDN Proxy">
                  <svg class="w-3 h-3 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 00-9.78 2.096A4.001 4.001 0 003 15z"/>
                  </svg>
                  <span>Cloudflare</span>
                </span>
              </template>
              <template x-if="!domainInfo.isCloudflare">
                <span class="px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-300 font-semibold border border-emerald-500/25 flex items-center space-x-1.5" :title="domainInfo.provider || 'Пряма IP адреса сервера'">
                  <svg class="w-3 h-3 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"/>
                  </svg>
                  <span>Direct Origin</span>
                </span>
              </template>
            </div>
          </div>

          <p x-show="parseError" class="text-xs text-rose-400 font-medium" x-text="parseError"></p>
        </div>

        <!-- Discovered URLs List Header & Filter -->
        <div class="px-4 py-3 border-b border-slate-800/60 flex items-center justify-between bg-slate-900/30">
          <div class="flex items-center space-x-2">
            <span class="text-xs font-semibold text-slate-300">Знайдені сторінки</span>
            <span class="px-2 py-0.5 rounded-full text-xs font-bold bg-slate-800 text-slate-300" x-text="discoveredUrls.length"></span>
          </div>
          <div class="flex space-x-2 text-xs">
            <button @click="selectAllUrls()" class="text-emerald-400 hover:underline">Усі</button>
            <span class="text-slate-600">/</span>
            <button @click="deselectAllUrls()" class="text-slate-400 hover:underline">Жодної</button>
          </div>
        </div>

        <!-- Discovered URL Search Box -->
        <template x-if="discoveredUrls.length > 0">
          <div class="px-4 py-2 bg-slate-950/20 border-b border-slate-800/40">
            <input type="text" x-model="urlFilter" placeholder="Фільтр сторінок..."
              class="w-full bg-slate-900 border border-slate-800 rounded px-2.5 py-1 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-slate-700">
          </div>
        </template>

        <!-- Discovered URLs Scrollable List -->
        <div class="flex-1 overflow-y-auto p-2 space-y-1">
          <template x-if="discoveredUrls.length === 0 && !isParsing">
            <div class="text-center py-12 px-4 text-slate-500 space-y-2">
              <svg class="w-10 h-10 mx-auto opacity-40 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
              </svg>
              <p class="text-xs font-medium">Введіть URL sitemap.xml для виявлення URL сторінок</p>
            </div>
          </template>

          <template x-for="(item, idx) in filteredDiscoveredUrls" :key="item.url">
            <label class="flex items-center space-x-2.5 p-2 rounded-lg hover:bg-slate-800/60 cursor-pointer text-xs group transition">
              <input type="checkbox" :value="item.url" x-model="selectedUrls"
                class="rounded border-slate-700 bg-slate-900 text-emerald-500 focus:ring-emerald-500/20 h-4 w-4">
              <span class="truncate text-slate-300 group-hover:text-white font-mono flex-1" x-text="item.url"></span>
            </label>
          </template>
        </div>

        <!-- POKÉMON PARADE STRIP (Directly above Start Button) -->
        <div class="relative overflow-hidden h-14 bg-slate-950/90 border-t border-slate-800/80 px-2 select-none shrink-0">
          <!-- Ground Line -->
          <div class="absolute bottom-0 left-0 right-0 h-[2px] ground-line"></div>

          <!-- STATE 1: IDLE ROW (High-Quality Gen 5 Showdown GIFs) -->
          <template x-if="!isScanning">
            <div class="absolute inset-0 pt-2 px-2 flex items-end justify-between z-10">
              <button type="button" @click.stop="openPokemonGame('squirtle')" class="pokemon-btn" title="Сквіртл 🐢 (Хто це за покемон?)">
                <img src="pokemon/idle/squirtle.gif" draggable="false" class="h-9 w-auto object-contain pokemon-sprite" alt="Squirtle" />
              </button>
              <button type="button" @click.stop="openPokemonGame('bulbasaur')" class="pokemon-btn" title="Бульбазавр 🍃 (Хто це за покемон?)">
                <img src="pokemon/idle/bulbasaur.gif" draggable="false" class="h-9 w-auto object-contain pokemon-sprite" alt="Bulbasaur" />
              </button>
              <button type="button" @click.stop="openPokemonGame('pikachu')" class="pokemon-btn" title="Пікачу ⚡ (Хто це за покемон?)">
                <img src="pokemon/idle/pikachu.gif" draggable="false" class="h-10 w-auto object-contain pokemon-sprite" alt="Pikachu" />
              </button>
              <button type="button" @click.stop="openPokemonGame('charmander')" class="pokemon-btn" title="Чармандер 🔥 (Хто це за покемон?)">
                <img src="pokemon/idle/charmander.gif" draggable="false" class="h-9 w-auto object-contain pokemon-sprite" alt="Charmander" />
              </button>
              <button type="button" @click.stop="openPokemonGame('jigglypuff')" class="pokemon-btn" title="Джігліпаф 🎵 (Хто це за покемон?)">
                <img src="pokemon/idle/jigglypuff.gif" draggable="false" class="h-9 w-auto object-contain pokemon-sprite" alt="Jigglypuff" />
              </button>
              <button type="button" @click.stop="openPokemonGame('gengar')" class="pokemon-btn" title="Генгар 👻 (Хто це за покемон?)">
                <img src="pokemon/idle/gengar.gif" draggable="false" class="h-9 w-auto object-contain pokemon-sprite" alt="Gengar" />
              </button>
            </div>
          </template>

          <!-- STATE 2: ACTIVE SCANNING (Running Parade Across the Track) -->
          <template x-if="isScanning">
            <div class="pokemon-sprint-track space-x-5 z-10 cursor-pointer" title="Наведіть курсор, щоб зупинити, або клікніть покемона для гри!">
              <button type="button" @click.stop="openPokemonGame('pikachu')" class="pokemon-btn" title="Пікачу біжить ⚡ (Хто це за покемон?)">
                <img src="pokemon/run/pikachu.gif" draggable="false" class="h-8 w-auto object-contain pokemon-sprite" alt="Pikachu" />
              </button>
              <button type="button" @click.stop="openPokemonGame('bulbasaur')" class="pokemon-btn" title="Бульбазавр біжить 🍃 (Хто це за покемон?)">
                <img src="pokemon/run/bulbasaur.gif" draggable="false" class="h-7 w-auto object-contain pokemon-sprite" alt="Bulbasaur" />
              </button>
              <button type="button" @click.stop="openPokemonGame('charmander')" class="pokemon-btn" title="Чармандер біжить 🔥 (Хто це за покемон?)">
                <img src="pokemon/run/charmander.gif" draggable="false" class="h-7 w-auto object-contain pokemon-sprite" alt="Charmander" />
              </button>
              <button type="button" @click.stop="openPokemonGame('squirtle')" class="pokemon-btn" title="Сквіртл біжить 🐢 (Хто це за покемон?)">
                <img src="pokemon/run/squirtle.gif" draggable="false" class="h-7 w-auto object-contain pokemon-sprite" alt="Squirtle" />
              </button>
              <button type="button" @click.stop="openPokemonGame('eevee')" class="pokemon-btn" title="Іві біжить 🦊 (Хто це за покемон?)">
                <img src="pokemon/run/eevee.gif" draggable="false" class="h-7 w-auto object-contain pokemon-sprite" alt="Eevee" />
              </button>
              <button type="button" @click.stop="openPokemonGame('gengar')" class="pokemon-btn" title="Генгар біжить 👻 (Хто це за покемон?)">
                <img src="pokemon/run/gengar.gif" draggable="false" class="h-7 w-auto object-contain pokemon-sprite" alt="Gengar" />
              </button>
              <button type="button" @click.stop="openPokemonGame('snorlax')" class="pokemon-btn" title="Снорлакс біжить 💤 (Хто це за покемон?)">
                <img src="pokemon/run/snorlax.gif" draggable="false" class="h-8 w-auto object-contain pokemon-sprite" alt="Snorlax" />
              </button>
            </div>
          </template>
        </div>

        <!-- Start Scan Action Footer -->
        <div class="p-4 border-t border-slate-800 bg-slate-950/80">
          <button @click="startScan()" :disabled="selectedUrls.length === 0 || isScanning"
            class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 disabled:opacity-40 text-white font-semibold py-2.5 px-4 rounded-xl shadow-lg shadow-emerald-600/20 flex items-center justify-center space-x-2 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <span>Запустити Сканування (<span x-text="selectedUrls.length"></span>)</span>
          </button>
        </div>
      </section>
