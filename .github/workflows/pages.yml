name: Deploy landing to Cloudflare Pages

# Push docs/** → Cloudflare Pages (speedmap.buhaiov.com).
# Secrets (repo Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — Account API Token, Pages Edit
#   CLOUDFLARE_ACCOUNT_ID  — Dashboard → Overview → Account ID
# Project must exist once: wrangler pages project create speedmap
#   or Dashboard → Workers & Pages → Create → Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy docs/ to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs --project-name=speedmap --commit-dirty=true
